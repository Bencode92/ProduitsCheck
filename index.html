  <div id="access-gate" style="display:none;position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0F172A,#1E293B);display:flex;align-items:center;justify-content:center">

      </div>
      <div id="gate-error" style="color:#EF4444;font-size:12px;margin-top:10px;min-height:18px"></div>
      <button onclick="checkAccessCode()" style="margin-top:16px;padding:12px 32px;background:linear-gradient(135deg,#2563EB,#1D4ED8);color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;width:100%">Accéder</button>

  <script>
  // Access code hash (SHA-256) — change this hash to change the code
  var ACCESS_HASH = '7b48cb9db9019c19652e945e4b05c764085ccb6a8967016293f0e1d1df8c398f';
  async function _sha256(str) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
  }
  async function checkAccessCode() {
    var code = document.getElementById('gate-code').value.trim();
    if (!code) { document.getElementById('gate-error').textContent = 'Entrez un code'; return; }
    var hash = await _sha256(code);
    if (hash === ACCESS_HASH) {
      sessionStorage.setItem('sb_auth', hash);
      document.getElementById('access-gate').style.display = 'none';
      document.getElementById('gate-code').value = '';
    } else {
      document.getElementById('gate-error').textContent = 'Code incorrect';
      document.getElementById('gate-code').value = '';
      document.getElementById('gate-code').focus();
    }
  }
  // Check on load
  (function() {
    var stored = sessionStorage.getItem('sb_auth');
    if (stored === ACCESS_HASH) {
      document.getElementById('access-gate').style.display = 'none';
    } else {
      document.getElementById('access-gate').style.display = 'flex';
      setTimeout(function() { document.getElementById('gate-code').focus(); }, 100);
    }
  })();
  </script>

  <script>
    function switchMainView(view) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.nav-tab[data-view="${view}"]`).classList.add('active');
      if (view === 'cat') { app.setState({ view: 'cat' }); renderCAT(document.getElementById('main-content')); }
      else if (view === 'analytics') { app.setState({ view: 'analytics' }); renderAnalytics(document.getElementById('main-content')); }
      else if (view === 'parser') { app.setState({ view: 'parser' }); renderBrochureParser(document.getElementById('main-content')); }
      else if (view === 'quality') { app.setState({ view: 'quality' }); renderQualityLookup(document.getElementById('main-content')); }
      else if (view === 'allocator') { app.setState({ view: 'allocator' }); renderUnifiedAllocator(document.getElementById('main-content')); }
      else if (view === 'market') { app.setState({ view: 'market' }); renderMarketDashboard(document.getElementById('main-content')); }
      else if (view === 'carry') { app.setState({ view: 'carry' }); renderCarrySimulator(document.getElementById('main-content')); }
      else { app.goToDashboard(); }
    }
    document.addEventListener('DOMContentLoaded', async () => {
      await app.init();
      await loadCATAIConversation();
      if (typeof loadOptimizerResult === 'function') await loadOptimizerResult();
      if (typeof loadStructOptimizerResult === 'function') await loadStructOptimizerResult();
      // Marché = page par défaut
      switchMainView('market');
    });
