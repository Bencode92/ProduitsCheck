name: Sync Market Data from stock-analysis-platform

on:
  schedule:
    - cron: '0 7 * * 1-5'
    - cron: '0 17 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [market-data-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ProduitsCheck
        uses: actions/checkout@v4

      - name: Download all market files
        run: |
          mkdir -p data/market
          BASE="https://raw.githubusercontent.com/Bencode92/stock-analysis-platform/main/data"
          for f in stocks_europe.json stocks_us.json markets.json sectors.json market_context.json macro_indicators.json; do
            curl -sL "$BASE/$f" -o "data/market/$f"
            echo "$f: $(wc -c < data/market/$f) bytes"
          done

      - name: Fetch latest Market Intelligence audit
        run: |
          MI_DIR="https://api.github.com/repos/Bencode92/stock-analysis-platform/contents/data/market_intelligence_audit"
          echo "Fetching MI file list..."
          FILES=$(curl -sL "$MI_DIR" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if isinstance(data, list):
              mi_files = [f for f in data if f['name'].startswith('mi_') and f['name'].endswith('.json')]
              mi_files.sort(key=lambda x: x['name'], reverse=True)
              if mi_files:
                  print(mi_files[0]['download_url'])
                  print(mi_files[0]['name'], file=sys.stderr)
              else:
                  print('', file=sys.stderr)
          else:
              print('API error', file=sys.stderr)
          ")
          if [ -n "$FILES" ] && [ "$FILES" != "" ]; then
            echo "Downloading latest MI: $FILES"
            curl -sL "$FILES" -o "data/market/market_intelligence.json"
            echo "market_intelligence.json: $(wc -c < data/market/market_intelligence.json) bytes"
          else
            echo "No MI files found, skipping"
          fi

      - name: Fetch rate data (ECB + Twelve Data fallback)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python3 scripts/fetch-rates.py

      - name: Fetch underlying proxy metrics (Twelve Data API)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python3 scripts/fetch-underlyings.py

      - name: Build enriched index
        run: |
          cat > /tmp/build_index.py << 'PYEOF'
          import json, os

          # ═══ STOCKS ═══
          index = {}
          ts = ''
          for region_file in ['stocks_europe.json', 'stocks_us.json']:
              path = f'data/market/{region_file}'
              if not os.path.exists(path): continue
              with open(path) as f: data = json.load(f)
              if not ts: ts = data.get('timestamp', '')
              for stock in data.get('stocks', []):
                  t = stock.get('ticker', '')
                  if not t: continue
                  index[t] = {
                      'name': stock.get('name', ''),
                      'name_api': stock.get('name_api', ''),
                      'sector': stock.get('sector', ''),
                      'industry': stock.get('industry', ''),
                      'country': stock.get('country', ''),
                      'price': stock.get('price'),
                      'change_pct': stock.get('change_percent'),
                      'perf_1m': stock.get('perf_1m'),
                      'perf_3m': stock.get('perf_3m'),
                      'perf_ytd': stock.get('perf_ytd'),
                      'perf_1y': stock.get('perf_1y'),
                      'perf_3y': stock.get('perf_3y'),
                      'beta': stock.get('beta'),
                      'volatility_3y': stock.get('volatility_3y'),
                      'max_dd_3y': stock.get('max_drawdown_3y'),
                      'max_dd_ytd': stock.get('max_drawdown_ytd'),
                      'distance_52w_high': stock.get('distance_52w_high'),
                      'distance_52w_low': stock.get('distance_52w_low'),
                      'pe_ratio': stock.get('pe_ratio'),
                      'roe': stock.get('roe'),
                      'roic': stock.get('roic'),
                      'de_ratio': stock.get('de_ratio'),
                      'net_margin': stock.get('net_margin'),
                      'revenue_growth_3y': stock.get('revenue_growth_3y'),
                      'fcf_yield': stock.get('fcf_yield'),
                      'eps_growth_5y': stock.get('eps_growth_5y'),
                      'dividend_yield': stock.get('dividend_yield'),
                      'buffett_score': stock.get('buffett_score'),
                      'buffett_grade': stock.get('buffett_grade'),
                      'quality_score': stock.get('quality_score'),
                      'quality_grade': stock.get('quality_grade'),
                      'quality_subscores': stock.get('quality_subscores'),
                      'region': stock.get('region', ''),
                  }

          # ═══ MARKETS ═══
          markets_summary = {}
          mp = 'data/market/markets.json'
          if os.path.exists(mp):
              with open(mp) as f: mdata = json.load(f)
              for region, indices in mdata.get('indices', {}).items():
                  for idx in indices:
                      markets_summary[idx.get('symbol', '')] = {
                          'name': idx.get('index_name', ''),
                          'country': idx.get('country', ''),
                          'value': idx.get('value_num'),
                          'change_pct': idx.get('change_num'),
                          'ytd': idx.get('ytd_num'),
                          'm3': idx.get('m3_num'),
                          'm6': idx.get('m6_num'),
                          'w52': idx.get('w52_num'),
                          'trend': idx.get('trend'),
                      }

          # ═══ MARKET CONTEXT ═══
          context = {}
          cp = 'data/market/market_context.json'
          if os.path.exists(cp):
              with open(cp) as f: ctx = json.load(f)
              tilts = ctx.get('macro_tilts', {})
              diag = ctx.get('_meta', {}).get('diagnostics', {})
              sector_class = {}
              for sc in diag.get('sector_classifications', []):
                  sector_class[sc['key']] = {
                      'classification': sc.get('classification'),
                      'ytd': sc.get('ytd'),
                      'm3': sc.get('m3'),
                      'm6': sc.get('m6'),
                      'w52': sc.get('w52'),
                      'momentum': sc.get('effective_momentum'),
                  }
              region_class = {}
              for rc in diag.get('region_classifications', []):
                  region_class[rc['key']] = {
                      'classification': rc.get('classification'),
                      'ytd': rc.get('ytd'),
                      'm3': rc.get('m3'),
                      'm6': rc.get('m6'),
                      'w52': rc.get('w52'),
                      'momentum': rc.get('effective_momentum'),
                  }
              context = {
                  'regime': ctx.get('market_regime'),
                  'confidence': ctx.get('confidence'),
                  'as_of': ctx.get('as_of'),
                  'favored_sectors': tilts.get('favored_sectors', []),
                  'avoided_sectors': tilts.get('avoided_sectors', []),
                  'favored_regions': tilts.get('favored_regions', []),
                  'avoided_regions': tilts.get('avoided_regions', []),
                  'key_trends': ctx.get('key_trends', []),
                  'risks': ctx.get('risks', []),
                  'sectors': sector_class,
                  'regions': region_class,
              }

          # ═══ MARKET INTELLIGENCE ═══
          mi = {}
          mip = 'data/market/market_intelligence.json'
          if os.path.exists(mip):
              with open(mip) as f: mi_data = json.load(f)
              ai = mi_data.get('ai_response', {})
              mdi = mi_data.get('market_data_input', {})
              mi = {
                  'timestamp': mi_data.get('timestamp', ''),
                  'regime': ai.get('regime', ''),
                  'regime_confidence': ai.get('regime_confidence', 0),
                  'regime_rationale': ai.get('regime_rationale', ''),
                  'warnings': ai.get('warnings', []),
                  'bond_strategy': ai.get('bond_strategy', {}),
                  'sector_momentum': mdi.get('sector_momentum_summary', ''),
                  'favored_sectors': mdi.get('favored_sectors', ''),
                  'avoided_sectors': mdi.get('avoided_sectors', ''),
                  'stress_flags': mdi.get('_stress_flags', []),
                  'vix': mdi.get('vix'),
                  'brent': mdi.get('brent_usd'),
                  'gold': mdi.get('gold_usd') or mdi.get('gold_price'),
                  'silver': mdi.get('silver_usd'),
              }
              print(f'MI: regime={mi["regime"]} conf={mi["regime_confidence"]}')

          # ═══ MACRO INDICATORS ═══
          macro = {}
          mcp = 'data/market/macro_indicators.json'
          if os.path.exists(mcp):
              with open(mcp) as f: mcd = json.load(f)
              flat = mcd.get('_market_data_flat', {})
              if flat:
                  macro = {k: flat.get(k) for k in ['gold_usd','silver_usd','brent_usd','vix','fed_funds_rate','us_10y_yield','dxy','date'] if flat.get(k) is not None}
              if not mi.get('gold') and macro.get('gold_usd'): mi['gold'] = macro['gold_usd']
              if not mi.get('silver') and macro.get('silver_usd'): mi['silver'] = macro['silver_usd']
              if not mi.get('brent') and macro.get('brent_usd'): mi['brent'] = macro['brent_usd']

          # ═══ UNDERLYINGS EXTRA (from Twelve Data API) ═══
          underlyings_extra = {}
          uep = 'data/market/underlyings_extra.json'
          if os.path.exists(uep):
              with open(uep) as f: ue = json.load(f)
              underlyings_extra = ue.get('tickers', {})
              print(f'Underlyings extra: {len(underlyings_extra)} tickers with real metrics')

          # ═══ SECTORS ETFs ═══
          sectors_perf = {}
          sp = 'data/market/sectors.json'
          if os.path.exists(sp):
              with open(sp) as f: sdata = json.load(f)
              for sector_key, etfs in sdata.get('sectors', {}).items():
                  eu_etfs = [e for e in etfs if e.get('region') == 'Europe']
                  if eu_etfs:
                      sectors_perf[sector_key] = [{
                          'name': e.get('display_fr', e.get('name', '')),
                          'ytd': e.get('ytd_num'),
                          'm3': e.get('m3_num'),
                          'w52': e.get('w52_num'),
                          'trend': e.get('trend'),
                      } for e in eu_etfs[:2]]

          # ═══ OUTPUT ═══
          output = {
              'timestamp': ts,
              'stocks_count': len(index),
              'markets_count': len(markets_summary),
              'stocks': index,
              'markets': markets_summary,
              'context': context,
              'market_intelligence': mi,
              'macro': macro,
              'underlyings_extra': underlyings_extra,
              'sectors_eu': sectors_perf,
          }

          with open('data/market/index.json', 'w') as f:
              json.dump(output, f, separators=(',', ':'))

          sz = os.path.getsize('data/market/index.json')
          print(f'Index: {len(index)} stocks, {len(markets_summary)} markets, {len(underlyings_extra)} underlyings extra')
          print(f'Size: {sz:,} bytes ({sz/1024:.0f} KB)')
          PYEOF
          python3 /tmp/build_index.py

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/market/
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "[Auto] Sync market data + MI + underlyings $(date +%Y-%m-%d-%H%M)"
            git push
            echo 'Market data synced!'
          fi
